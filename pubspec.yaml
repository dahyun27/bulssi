name: bulssi
description: "자기계발 커뮤니티 앱 — 불씨 (Bulssi)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리
  flutter_riverpod: ^2.5.1

  # 라우팅
  go_router: ^14.0.0

  # Firebase
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_storage: ^12.0.0

  # 네트워크
  dio: ^5.4.0

  # 로컬 저장소
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.0

  # 이미지
  cached_network_image: ^3.3.0
  image_picker: ^1.1.0

  # 인앱 결제
  in_app_purchase: ^3.2.0

  # 불변 모델
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # 푸시 알림
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # 코드 생성
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0

  # 테스트
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
